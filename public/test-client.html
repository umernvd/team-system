<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Roster — API Test Client</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333;padding:20px}
h1{font-size:22px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
h1 span{font-size:14px;color:#888;font-weight:400}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:12px;color:#555;border-bottom:1px solid #eee;padding-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:#666;white-space:nowrap}
input,select,textarea,button{font-size:13px;padding:6px 10px;border:1px solid #ccc;border-radius:4px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#4a90d9}
input[type="text"],input[type="password"],select{flex:1;min-width:100px}
textarea{width:100%;min-height:70px;font-family:monospace;resize:vertical}
button{background:#4a90d9;color:#fff;border:none;cursor:pointer;font-weight:600;white-space:nowrap}
button:hover{background:#357abd}
button.danger{background:#d9534f}
button.danger:hover{background:#c9302c}
button.secondary{background:#6c757d}
button.secondary:hover{background:#5a6268}
button.sm{padding:4px 8px;font-size:12px}
#response{font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:4px;max-height:300px;overflow:auto}
#response .status{color:#fff;padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:6px;font-size:12px}
#response .status.ok{background:#28a745}
#response .status.err{background:#dc3545}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #eee}
th{background:#fafafa;color:#666;font-weight:600}
tr:hover{background:#f8f9fa}
.auth-status{font-size:13px;color:#666;padding:4px 0}
.auth-status b{color:#333}
</style>
</head>
<body>

<h1>&#x1F527; Team Roster <span>API Test Client</span></h1>

<div class="card">
  <h2>Configuration</h2>
  <div class="row">
    <label>Base URL</label>
    <input type="text" id="baseUrl" value="http://localhost:5000">
    <label>Auth</label>
    <select id="authMode" onchange="toggleAuthFields()">
      <option value="session" selected>Session</option>
      <option value="none">None</option>
      <option value="basic">Basic</option>
      <option value="bearer">Bearer</option>
    </select>
  </div>
  <div id="basicFields" class="row hidden">
    <label>Username</label>
    <input type="text" id="basicUser" placeholder="username">
    <label>Password</label>
    <input type="password" id="basicPass" placeholder="password">
  </div>
  <div id="bearerFields" class="row hidden">
    <label>Token</label>
    <input type="text" id="bearerToken" placeholder="paste your token here">
  </div>
  <div class="auth-status" id="authStatus">Not logged in</div>
</div>

<div class="card">
  <h2>Authentication</h2>
  <div class="row">
    <input type="text" id="regUser" placeholder="username">
    <input type="password" id="regPass" placeholder="password">
    <select id="regRole">
      <option value="user">user</option>
      <option value="admin">admin</option>
    </select>
    <button onclick="register()">Register</button>
  </div>
  <div class="row">
    <input type="text" id="loginUser" placeholder="username">
    <input type="password" id="loginPass" placeholder="password">
    <button onclick="login()">Login</button>
    <button class="secondary sm" onclick="logout()">Logout</button>
  </div>
</div>

<div class="card">
  <h2>Employees</h2>
  <div class="row">
    <button onclick="listEmployees()">&#x1F504; List All</button>
    <span id="empCount" style="font-size:13px;color:#888"></span>
  </div>
  <div id="empTable" class="hidden">
    <table><thead><tr><th>Name</th><th>Role</th><th>Department</th><th>ID</th></tr></thead><tbody id="empBody"></tbody></table>
  </div>
  <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
  <div class="row">
    <input type="text" id="addName" placeholder="name">
    <input type="text" id="addRole" placeholder="role">
    <input type="text" id="addDept" placeholder="department">
    <button onclick="addEmployee()">+ Add</button>
  </div>
  <div class="row" style="flex-direction:column;align-items:stretch">
    <label style="font-size:12px;color:#888">Bulk insert (JSON array)</label>
    <textarea id="bulkData" placeholder='[{"name":"...","role":"...","department":"..."}]'></textarea>
    <button onclick="bulkInsert()" style="align-self:flex-end;margin-top:4px">Submit Bulk</button>
  </div>
  <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
  <div class="row">
    <label>ID</label>
    <input type="text" id="updId" style="width:180px" placeholder="_id">
    <input type="text" id="updName" placeholder="new name">
    <input type="text" id="updRole" placeholder="new role">
    <input type="text" id="updDept" placeholder="new dept">
    <button onclick="updateEmployee()">Update</button>
  </div>
  <div class="row">
    <label>ID</label>
    <input type="text" id="delId" style="width:180px" placeholder="_id">
    <button class="danger" onclick="deleteEmployee()">Delete</button>
  </div>
</div>

<div class="card">
  <h2>Response</h2>
  <div id="response"><span style="color:#888">Send a request to see the response here.</span></div>
</div>

<script>
const BASE = () => document.getElementById('baseUrl').value.replace(/\/+$/,'');
const authMode = () => document.getElementById('authMode').value;

function toggleAuthFields() {
  const mode = authMode();
  document.getElementById('basicFields').classList.toggle('hidden', mode !== 'basic');
  document.getElementById('bearerFields').classList.toggle('hidden', mode !== 'bearer');
}

function getAuthHeaders() {
  const mode = authMode();
  if (mode === 'basic') {
    const u = document.getElementById('basicUser').value;
    const p = document.getElementById('basicPass').value;
    if (u && p) return { 'Authorization': 'Basic ' + btoa(u + ':' + p) };
  }
  if (mode === 'bearer') {
    const t = document.getElementById('bearerToken').value;
    if (t) return { 'Authorization': 'Bearer ' + t };
  }
  return {};
}

function updateAuthStatus(msg) {
  document.getElementById('authStatus').innerHTML = msg;
}

async function api(path, opts = {}) {
  const url = BASE() + path;
  const headers = { 'Content-Type': 'application/json', ...getAuthHeaders(), ...opts.headers };
  const res = await fetch(url, { ...opts, headers, credentials: 'include' });
  const body = res.headers.get('content-type')?.includes('json') ? await res.json() : await res.text();
  showResponse(res.status, body);
  if (!res.ok) throw { status: res.status, body };
  return body;
}

function showResponse(status, body) {
  const el = document.getElementById('response');
  const cls = status >= 200 && status < 300 ? 'ok' : 'err';
  const txt = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
  el.innerHTML = `<div class="status ${cls}">${status}</div>\n` + txt;
}

async function register() {
  try {
    const u = document.getElementById('regUser').value;
    const p = document.getElementById('regPass').value;
    const r = document.getElementById('regRole').value;
    if (!u || !p) return showResponse(400, { error: 'Username and password required' });
    await api('/auth/register', { method: 'POST', body: JSON.stringify({ username: u, password: p, role: r }) });
  } catch(e) {}
}

async function login() {
  try {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    if (!u || !p) return showResponse(400, { error: 'Username and password required' });
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    if (authMode() === 'basic') {
      document.getElementById('basicUser').value = u;
      document.getElementById('basicPass').value = p;
      updateAuthStatus(`&#x2705; Stored credentials for <b>${u}</b> (role: ${data.user.role})`);
    }
    if (authMode() === 'bearer' && data.accessToken) {
      document.getElementById('bearerToken').value = data.accessToken;
      updateAuthStatus(`&#x2705; Token stored for <b>${data.user.username}</b> (role: ${data.user.role})`);
    }
    if (authMode() === 'session') {
      updateAuthStatus(`&#x2705; Session active for <b>${data.user.username}</b> (role: ${data.user.role})`);
    }
  } catch(e) {}
}

function logout() {
  fetch(BASE() + '/auth/logout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include'
  }).then(r => r.json()).then(d => showResponse(200, d)).catch(e => showResponse(0, { error: e.message }));
  document.getElementById('basicUser').value = '';
  document.getElementById('basicPass').value = '';
  document.getElementById('bearerToken').value = '';
  updateAuthStatus('Not logged in');
}

async function listEmployees() {
  try {
    const data = await api('/employees');
    const tb = document.getElementById('empBody');
    const ct = document.getElementById('empCount');
    if (Array.isArray(data)) {
      ct.textContent = 'Total: ' + data.length;
      tb.innerHTML = data.map(e => `<tr><td>${esc(e.name)}</td><td>${esc(e.role)}</td><td>${esc(e.department)}</td><td style="font-size:11px;color:#999">${e._id}</td></tr>`).join('');
      document.getElementById('empTable').classList.remove('hidden');
    }
  } catch(e) {}
}

async function addEmployee() {
  try {
    const n = document.getElementById('addName').value;
    const r = document.getElementById('addRole').value;
    const d = document.getElementById('addDept').value;
    if (!n || !r || !d) return showResponse(400, { error: 'Name, role, department required' });
    await api('/employees', { method: 'POST', body: JSON.stringify({ name: n, role: r, department: d }) });
    listEmployees();
  } catch(e) {}
}

async function bulkInsert() {
  try {
    const raw = document.getElementById('bulkData').value;
    let data;
    try { data = JSON.parse(raw); } catch(e) { return showResponse(400, { error: 'Invalid JSON' }); }
    if (!Array.isArray(data)) return showResponse(400, { error: 'Must be a JSON array' });
    await api('/employees', { method: 'POST', body: JSON.stringify(data) });
    listEmployees();
  } catch(e) {}
}

async function updateEmployee() {
  try {
    const id = document.getElementById('updId').value;
    if (!id) return showResponse(400, { error: 'ID required' });
    const body = {};
    ['updName','updRole','updDept'].forEach(f => {
      const v = document.getElementById(f).value;
      const key = f.replace('upd','').toLowerCase();
      if (v) body[key] = v;
    });
    if (!Object.keys(body).length) return showResponse(400, { error: 'At least one field to update' });
    await api('/employees/' + id, { method: 'PUT', body: JSON.stringify(body) });
    listEmployees();
  } catch(e) {}
}

async function deleteEmployee() {
  try {
    const id = document.getElementById('delId').value;
    if (!id) return showResponse(400, { error: 'ID required' });
    await api('/employees/' + id, { method: 'DELETE' });
    listEmployees();
  } catch(e) {}
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
